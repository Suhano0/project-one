<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Firebase Secure App</title>

<style>
body { font-family: Arial; text-align:center; background:#111; color:white; }
input, button { padding:10px; margin:5px; width:90%; }
.post { border:1px solid cyan; margin:10px; padding:10px; }
img { max-width:100%; margin-top:10px; }
</style>
</head>

<body>

<h2>Secure Firebase System</h2>

<button id="login">Login Google</button>
<button id="logout" style="display:none;">Logout</button>

<p id="user"></p>

<form id="form" style="display:none;">
    <input id="text" placeholder="Message" required>
    <input type="file" id="image">
    <button>Send</button>
</form>

<div id="feed"></div>

<script type="module">

// 🔥 IMPORT
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
  getFirestore, collection, addDoc, onSnapshot,
  query, orderBy, doc, updateDoc, increment, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

import {
  getAuth, signInWithPopup, GoogleAuthProvider,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";


// 🔥 CONFIG (ТВОЙ)
const firebaseConfig = {
  apiKey: "AIzaSyBL9VYkz-H6C3jsSdP2t9j7iflVH1dgoUs",
  authDomain: "suhh-d5e46.firebaseapp.com",
  projectId: "suhh-d5e46",
  storageBucket: "suhh-d5e46.firebasestorage.app",
  messagingSenderId: "460049677444",
  appId: "1:460049677444:web:49c6b125f5de94397016d1"
};


// INIT
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

// 👉 для F12 (оставляем)
window.db = db;
window.doc = doc;
window.updateDoc = updateDoc;


// UI
const login = document.getElementById('login');
const logout = document.getElementById('logout');
const form = document.getElementById('form');
const userText = document.getElementById('user');
const feed = document.getElementById('feed');

// LOGIN
login.onclick = () => signInWithPopup(auth, provider);
logout.onclick = () => signOut(auth);

// AUTH
onAuthStateChanged(auth, (user) => {
    if (user) {
        login.style.display = "none";
        logout.style.display = "block";
        form.style.display = "block";
        userText.innerText = user.displayName;
        loadPosts();
    } else {
        login.style.display = "block";
        logout.style.display = "none";
        form.style.display = "none";
        userText.innerText = "";
        feed.innerHTML = "";
    }
});

// SEND POST + IMAGE
form.onsubmit = async (e) => {
    e.preventDefault();

    const file = document.getElementById('image').files[0];
    let imageUrl = "";

    if (file) {
        const storageRef = ref(storage, "images/" + Date.now());
        await uploadBytes(storageRef, file);
        imageUrl = await getDownloadURL(storageRef);
    }

    await addDoc(collection(db, "posts"), {
        text: document.getElementById('text').value,
        user: auth.currentUser.displayName,
        image: imageUrl,
        likes: 0,
        timestamp: serverTimestamp()
    });

    form.reset();
};

// REALTIME
function loadPosts() {
    const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
        feed.innerHTML = "";

        snapshot.forEach(docSnap => {
            const d = docSnap.data();

            const div = document.createElement('div');
            div.className = "post";

            div.innerHTML = `
    <b>${d.user}</b><br>
    ${d.text}<br>
    ❤️ ${d.likes}
    <button onclick="like('${docSnap.id}')">Like</button>
    ${auth.currentUser && auth.currentUser.displayName === d.user 
        ? `<button onclick="removePost('${docSnap.id}')">Delete</button>` 
        : ""}
`;

            feed.appendChild(div);
        });
    });
}

// LIKE
window.like = async (id) => {
    const refDoc = doc(db, "posts", id);
    await updateDoc(refDoc, {
        likes: increment(1)
    });
};

    import { deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

window.removePost = async (id) => {
    try {
        await deleteDoc(doc(db, "posts", id));
    } catch (e) {
        alert("Нет прав на удаление!");
    }
};

</script>

</body>
</html>
