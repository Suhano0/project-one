<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Access Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1: #0f0c29; --bg2: #302b63; --bg3: #24243e;
            --accent: #7f5af0; --accent2: #00f5ff;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
            color: white;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .portal {
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 40px rgba(0, 245, 255, 0.2);
            margin-bottom: 30px;
        }

        h1 {
            text-align: center; margin-bottom: 25px; font-size: 1.4rem;
            background: linear-gradient(90deg, var(--accent2), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        #auth-section { text-align: center; margin-bottom: 20px; }

        .auth-btn {
            background: rgba(127, 90, 240, 0.2);
            border: 1px solid var(--accent);
            padding: 10px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            width: 100%; border-radius: 10px; color: white; cursor: pointer;
            font-family: 'Orbitron', sans-serif;
        }

        input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3);
            color: white; outline: none; transition: 0.3s; box-sizing: border-box;
        }

        input:focus { border-color: var(--accent2); box-shadow: 0 0 10px var(--accent2); }

        .submit-btn {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            color: white; font-weight: 600; cursor: pointer; transition: 0.3s;
        }

        #feed { width: 100%; max-width: 450px; }

        .post {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent2);
            padding: 15px; margin-bottom: 15px; border-radius: 0 10px 10px 0;
        }

        .post-header { font-size: 0.8rem; color: var(--accent2); margin-bottom: 5px; }
        .post-content { font-size: 0.9rem; margin-bottom: 10px; opacity: 0.9; }

        .like-btn {
            background: transparent; border: 1px solid var(--accent2);
            width: auto; padding: 5px 15px; font-size: 0.7rem; color: white; cursor: pointer;
        }

        #log-status { margin-top: 15px; text-align: center; font-size: 0.8rem; color: var(--accent2); }
    </style>
</head>
<body>

<div class="portal">
    <h1>QUANTUM LINK ACCESS</h1>

    <div id="auth-section">
        <button id="login-btn" class="auth-btn">INITIALIZE AUTH (GOOGLE)</button>
        <button id="logout-btn" class="auth-btn" style="display:none;">TERMINATE SESSION</button>
        <div id="user-info" style="font-size: 0.7rem; margin-top: 10px; color: var(--accent2);"></div>
    </div>

    <form id="firebase-form" style="display:none;">
        <input type="text" id="name" placeholder="Identifier (Name)" required>
        <input type="email" id="email" placeholder="Uplink (Email)" required>
        <button type="submit" class="submit-btn">SEND PACKET</button>
    </form>
    
    <div id="log-status">Awaiting authorization...</div>
</div>

<div id="feed"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, onSnapshot, 
        query, orderBy, updateDoc, doc, increment, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { 
        getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBL9VYkz-H6C3jssDP2t9j7iflVH1dgoUs",
        authDomain: "suhh-d5e46.firebaseapp.com",
        projectId: "suhh-d5e46",
        storageBucket: "suhh-d5e46.firebasestorage.app",
        messagingSenderId: "460049677444",
        appId: "1:460049677444:web:49c6b125f5de94397016d1",
        measurementId: "G-290D5X7LS5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const form = document.getElementById('firebase-form');
    const status = document.getElementById('log-status');
    const feed = document.getElementById('feed');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfo = document.getElementById('user-info');

    // --- ОБРАБОТКА ВХОДА ---

    loginBtn.onclick = () => signInWithRedirect(auth, provider);
    logoutBtn.onclick = () => signOut(auth);

    // Ловим результат после перезагрузки страницы
    getRedirectResult(auth).catch(err => console.error("Redirect Error:", err));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'block';
            form.style.display = 'block';
            userInfo.innerHTML = `ONLINE: ${user.displayName}`;
            status.innerHTML = "System online ⚡";
        } else {
            loginBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
            form.style.display = 'none';
            userInfo.innerHTML = "";
            status.innerHTML = "Awaiting authorization...";
        }
    });

    // --- БАЗА ДАННЫХ ---

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.innerHTML = "Syncing...";
        try {
            await addDoc(collection(db, "requests"), {
                user: document.getElementById('name').value,
                contact: document.getElementById('email').value,
                likes: 0,
                timestamp: serverTimestamp()
            });
            status.innerHTML = "Success! Packet sent.";
            form.reset();
        } catch (err) {
            status.innerHTML = "Error: No Permission ❌";
            console.error(err);
        }
    });

    function loadRequests() {
        const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            feed.innerHTML = "";
            snapshot.forEach((post) => {
                const data = post.data();
                const postElement = document.createElement('div');
                postElement.className = 'post';
                postElement.innerHTML = `
                    <div class="post-header">> ID: ${data.user}</div>
                    <div class="post-content">${data.contact}</div>
                    <button class="like-btn" data-id="${post.id}">
                        ENERGY: ${data.likes || 0}
                    </button>
                `;
                feed.appendChild(postElement);
            });
        });
    }

    // Слушатель кликов для лайков (исправленный метод)
    document.addEventListener('click', async (e) => {
        if (e.target.classList.contains('like-btn')) {
            const id = e.target.getAttribute('data-id');
            const postRef = doc(db, "requests", id);
            try {
                await updateDoc(postRef, { likes: increment(1) });
            } catch (err) {
                alert("Auth required for Energy Boost!");
            }
        }
    });

    loadRequests();
</script>
</body>
</html>
