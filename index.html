<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Quantum Firebase</title>
<style>
body {
    font-family: Arial;
    background: #0f0c29;
    color: white;
    text-align: center;
}
.portal {
    max-width: 400px;
    margin: auto;
}
button, input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
}
.post {
    border: 1px solid cyan;
    margin: 10px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="portal">
    <h2>Quantum Access</h2>

    <button id="login">Login Google</button>
    <button id="logout" style="display:none;">Logout</button>

    <p id="user"></p>

    <form id="form" style="display:none;">
        <input id="name" placeholder="Name" required>
        <input id="text" placeholder="Message" required>
        <button>Send</button>
    </form>
</div>

<div id="feed"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot,
  query, orderBy, doc, updateDoc, increment, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import {
  getAuth, signInWithPopup, GoogleAuthProvider,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

// 🔥 ТВОЙ конфиг (правильный)
const firebaseConfig = {
  apiKey: "AIzaSyBL9VYkz-H6C3jsSdP2t9j7iflVH1dgoUs",
  authDomain: "suhh-d5e46.firebaseapp.com",
  projectId: "suhh-d5e46",
  storageBucket: "suhh-d5e46.firebasestorage.app",
  messagingSenderId: "460049677444",
  appId: "1:460049677444:web:49c6b125f5de94397016d1",
  measurementId: "G-290D5X7LS5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.db = db;
window.doc = doc;
window.updateDoc = updateDoc;
window.increment = increment;

// UI
const login = document.getElementById('login');
const logout = document.getElementById('logout');
const form = document.getElementById('form');
const userText = document.getElementById('user');
const feed = document.getElementById('feed');

// LOGIN
login.onclick = () => signInWithPopup(auth, provider);
logout.onclick = () => signOut(auth);

// AUTH STATE
onAuthStateChanged(auth, (user) => {
    if (user) {
        login.style.display = "none";
        logout.style.display = "block";
        form.style.display = "block";
        userText.innerText = "User: " + user.displayName;
        loadPosts();
    } else {
        login.style.display = "block";
        logout.style.display = "none";
        form.style.display = "none";
        userText.innerText = "";
        feed.innerHTML = "";
    }
});

// SEND MESSAGE
form.onsubmit = async (e) => {
    e.preventDefault();

    await addDoc(collection(db, "requests"), {
        user: document.getElementById('name').value,
        text: document.getElementById('text').value,
        likes: 0,
        timestamp: serverTimestamp()
    });

    form.reset();
};

// LOAD POSTS (REALTIME)
function loadPosts() {
    const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
        feed.innerHTML = "";

        snapshot.forEach(docSnap => {
            const data = docSnap.data();

            const div = document.createElement('div');
            div.className = "post";

            div.innerHTML = `
                <b>${data.user}</b><br>
                ${data.text}<br>
                ❤️ ${data.likes || 0}
                <button onclick="like('${docSnap.id}')">Like</button>
            `;

            feed.appendChild(div);
        });
    });
}

// LIKE (атомарно!)
window.like = async (id) => {
    const ref = doc(db, "requests", id);
    await updateDoc(ref, {
        likes: increment(1)
    });
};
</script>

</body>
</html>
