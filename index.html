<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum DM Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg1: #0f0c29; --bg2: #302b63; --bg3: #24243e; --accent: #7f5af0; --accent2: #00f5ff; }
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; font-family: 'Orbitron', sans-serif; background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3)); color: white; padding: 20px; overflow-y: auto; }
        .portal { width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; backdrop-filter: blur(20px); background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 40px rgba(0, 245, 255, 0.2); margin-bottom: 20px; }
        h1 { text-align: center; font-size: 1.2rem; background: linear-gradient(90deg, var(--accent2), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-btn { background: rgba(127, 90, 240, 0.2); border: 1px solid var(--accent); padding: 10px; width: 100%; border-radius: 10px; color: white; cursor: pointer; font-family: 'Orbitron'; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: white; font-weight: 600; cursor: pointer; }
        .post { background: rgba(255, 255, 255, 0.03); border-left: 3px solid var(--accent2); padding: 15px; margin-bottom: 10px; border-radius: 0 10px 10px 0; font-size: 0.9rem; }
        .status { font-size: 0.7rem; color: var(--accent2); text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="portal">
    <h1>QUANTUM DM ACCESS</h1>
    <div id="auth-section">
        <button id="login-btn" class="auth-btn">INITIALIZE AUTH (GOOGLE)</button>
        <button id="logout-btn" class="auth-btn" style="display:none;">TERMINATE SESSION</button>
        <div id="user-info" class="status"></div>
    </div>
    <form id="dm-form" style="display:none; margin-top: 20px;">
        <input type="text" id="target-user" placeholder="Кому (Name)" required>
        <input type="text" id="message-text" placeholder="Ваше личное сообщение..." required>
        <button type="submit" class="submit-btn">SEND MESSAGE</button>
    </form>
    <div id="log-status" class="status">Awaiting authorization...</div>
</div>
<div id="feed" style="width: 100%; max-width: 450px;"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBL9VYkz-H6C3jssDP2t9j7iflVH1dgoUs",
        authDomain: "suhh-d5e46.firebaseapp.com",
        projectId: "suhh-d5e46",
        storageBucket: "suhh-d5e46.firebasestorage.app",
        messagingSenderId: "460049677444",
        appId: "1:460049677444:web:49c6b125f5de94397016d1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const form = document.getElementById('dm-form');
    const status = document.getElementById('log-status');
    const feed = document.getElementById('feed');
    const userInfo = document.getElementById('user-info');

    loginBtn.onclick = () => signInWithRedirect(auth, provider);
    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'block';
            form.style.display = 'block';
            userInfo.innerHTML = "Logged as: " + user.displayName;
            status.innerHTML = "System Ready ⚡";
            loadDMs(user.displayName);
        } else {
            loginBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
            form.style.display = 'none';
            status.innerHTML = "Awaiting Auth...";
        }
    });

    form.onsubmit = async (e) => {
        e.preventDefault();
        try {
            await addDoc(collection(db, "private_messages"), {
                from: auth.currentUser.displayName,
                to: document.getElementById('target-user').value,
                text: document.getElementById('message-text').value,
                timestamp: serverTimestamp()
            });
            form.reset();
            status.innerHTML = "Message Sent!";
        } catch (err) { alert("Error: " + err.message); }
    };

    function loadDMs(myName) {
        const q = query(collection(db, "private_messages"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            feed.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                // Показываем сообщение только если оно ВАМ или ОТ ВАС
                if (data.to === myName || data.from === myName) {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <div style="color:var(--accent2); font-size:0.7rem;">FROM: ${data.from} | TO: ${data.to}</div>
                        <div style="margin-top:5px;">${data.text}</div>
                    `;
                    feed.appendChild(div);
                }
            });
        });
    }
</script>
</body>
</html>
